    <title>Three-Letter Word Challenge | K S Lo Scrabble</title>
    <style>
        :root {
            --primary: #6366f1; /* Indigo/Purple */
            --primary-light: #818cf8;
            --primary-dark: #4338ca;
            --accent: #a855f7; /* Purple Accent */
            --background: #f0f4f8;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        h1 {
            font-size: 1.6rem;
            background: linear-gradient(to right, var(--primary-dark), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin: 0 1rem;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            position: relative;
            overflow-y: auto;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-top: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        /* Views */
        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            min-height: 0; 
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassy Card Style for Containers */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            width: 100%;
        }

        /* Start Screen Controls */
        .control-group {
            margin-bottom: 1.5rem;
            text-align: center;
            width: 100%;
        }

        .control-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Custom Select */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        select {
            appearance: none;
            background: white;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .custom-select-wrapper::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--primary);
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Start Screen Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        button {
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-group button {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 0.8rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 
                0 4px 10px rgba(99, 102, 241, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-group button:hover {
            background: linear-gradient(135deg, rgba(110, 113, 245, 1), rgba(180, 100, 250, 1));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(99, 102, 241, 0.4);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* Game Screen Aesthetic Updates */
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
            min-width: 80px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 700;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-dark);
            font-variant-numeric: tabular-nums;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-sub);
            font-weight: 500;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 380px;
        }

        /* Game Buttons */
        .option-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            font-size: 2.2rem; /* Adjusted for 3 letters */
            font-weight: 800;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 8px 20px -5px rgba(99, 102, 241, 0.4),
                inset 0 0 0 1px rgba(255,255,255,0.2),
                inset 0 2px 10px rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .option-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg);
            transition: transform 0.5s;
            opacity: 0;
        }

        .option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, rgba(110, 113, 245, 1), rgba(180, 100, 250, 1));
            border-color: rgba(255, 255, 255, 0.8);
        }

        .option-btn:hover::after {
            opacity: 1;
            transform: rotate(30deg) translate(20%, 20%);
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Definition Box */
        .definition-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .definition-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .def-word {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .def-text {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Navigation Buttons */
        .next-btn-container {
            width: 100%;
            height: 60px;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            width: 100%;
            padding: 1rem;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            border: none;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Quit Button */
        .btn-secondary {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Result Screen */
        .result-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
        }

        .final-score {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.5rem 0;
            line-height: 1;
        }

        .final-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.5);
            display: inline-block;
            padding: 0.25rem 1rem;
            border-radius: 20px;
            align-self: center;
            font-variant-numeric: tabular-nums;
        }

        .remark {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        /* Review List Styles */
        .review-container {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.5);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .review-header {
            padding: 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.4);
        }

        .review-list {
            overflow-y: auto;
            padding: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-light) transparent;
        }

        .review-list::-webkit-scrollbar {
            width: 6px;
        }
        .review-list::-webkit-scrollbar-thumb {
            background-color: var(--primary-light);
            border-radius: 3px;
        }

        .review-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-word {
            font-weight: 800;
            color: var(--primary);
            width: 60px;
            flex-shrink: 0;
        }

        .review-def {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        @media (max-height: 700px) {
            h1 { font-size: 1.3rem; }
            .brand { font-size: 0.65rem; }
            .grid-options { gap: 0.75rem; max-height: 320px; }
            .option-btn { font-size: 1.8rem; border-radius: 16px; }
            .definition-box { margin-top: 0.75rem; padding: 0.75rem; min-height: 60px; }
            .question-text { margin-bottom: 0.75rem; font-size: 0.9rem; }
            .score-board { margin-bottom: 1rem; padding: 8px 15px; }
            .stat-value { font-size: 1rem; }
            .btn-group { gap: 0.5rem; }
            .btn-group button { padding: 0.6rem; font-size: 0.9rem; }
            .result-card { padding: 1.5rem; }
            .final-score { font-size: 3rem; margin: 0.5rem 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">K S Lo Scrabble</div>
        <h1>Three-Letter Word Challenge</h1>
        <div class="subtitle">CSW24</div>
    </header>

    <main>
        <!-- Start Screen -->
        <div id="start-screen" class="view active">
            <div class="glass-panel">
                
                <div class="control-group">
                    <label class="control-label">Select Letter to Practice</label>
                    <div class="custom-select-wrapper">
                        <select id="letter-select">
                            <option value="ALL">All Letters</option>
                            <!-- Options A-Z injected by JS -->
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Number of Questions</label>
                    <div class="btn-group">
                        <button onclick="startGame(10)">10</button>
                        <button onclick="startGame(20)">20</button>
                        <button onclick="startGame(30)">30</button>
                        <button onclick="startGame(40)">40</button>
                        <button onclick="startGame(50)">50</button>
                        <button onclick="startGame(100)">100</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="view">
            <div class="score-board">
                <div class="stat-item">
                    <span class="stat-label">Progress</span>
                    <span class="stat-value" id="progress-display">1 / 10</span>
                </div>
                <!-- Timer -->
                <div class="stat-item">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer-display">00:00.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score-display">0</span>
                </div>
            </div>
            
            <div class="question-text">Choose the correct 3-letter word.</div>

            <div class="grid-options" id="options-grid">
                <!-- Buttons injected by JS -->
            </div>

            <div class="definition-box" id="definition-box">
                <div class="def-word" id="def-word"></div>
                <div class="def-text" id="def-text"></div>
            </div>

            <div class="next-btn-container">
                <button id="next-btn" class="btn-primary" style="display: none;" onclick="nextQuestion()">Next Question</button>
            </div>

            <button class="btn-secondary" onclick="returnToTitle()">Quit to Title</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="view">
            <div class="result-card">
                <h2 style="color: var(--primary-dark);">Challenge Complete!</h2>
                <div class="final-score" id="final-score">8/10</div>
                <!-- Final Time Display -->
                <div class="final-time" id="final-time-display">Time: 00:00.00</div>
                <div class="remark" id="final-remark">Excellent work!</div>
                
                <div class="review-container">
                    <div class="review-header" id="review-header">Words Practised</div>
                    <div id="review-list" class="review-list">
                        <!-- Items injected by JS -->
                    </div>
                </div>

                <button class="btn-primary" onclick="returnToTitle()">Play Again</button>
            </div>
        </div>
    </main>

    <footer>
        © <span id="current-year"></span> K S Lo Scrabble Team. All Rights Reserved.
    </footer>

        const validWords = Object.keys(wordDatabase);
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        // --- Game State ---
        let currentQuestionIndex = 0;
        let totalQuestions = 10;
        let score = 0;
        let currentCorrectWord = "";
        let attemptMade = false;
        let sessionWords = [];
        let filteredWords = []; // Words available based on letter selection
        let gamePool = []; // Shuffled deck for the current game
        
        // --- Timer State ---
        let startTime;
        let timerInterval;

        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const optionsGrid = document.getElementById('options-grid');

        // --- Initialization ---
        function init() {
            // Populate Letter Select
            alphabet.split('').forEach(letter => {
                const option = document.createElement('option');
                option.value = letter;
                option.textContent = `Words starting with ${letter}`;
                letterSelect.appendChild(option);
            });
            document.getElementById('current-year').textContent = new Date().getFullYear();
        }

        // --- Functions ---

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function startGame(numQuestions) {
            const selectedLetter = letterSelect.value;
            
            // Filter words based on selection
            if (selectedLetter === 'ALL') {
                filteredWords = [...validWords];
            } else {
                filteredWords = validWords.filter(w => w.startsWith(selectedLetter));
            }

            if (filteredWords.length === 0) {
                alert("No words found for this selection.");
                return;
            }

            totalQuestions = numQuestions;
            currentQuestionIndex = 0;
            score = 0;
            sessionWords = [];
            
            // Create a game pool (deck)
            // If we ask for 50 questions but only have 10 words (e.g., 'X'), we need to repeat.
            gamePool = [...filteredWords];
            shuffleArray(gamePool);

            // If not enough words, duplicate the pool until we have enough
            while (gamePool.length < totalQuestions) {
                let moreWords = [...filteredWords];
                shuffleArray(moreWords);
                gamePool = gamePool.concat(moreWords);
            }
            
            // Trim to exact number needed
            gamePool = gamePool.slice(0, totalQuestions);

            switchView('game-screen');
            startTimer();
            loadQuestion();
        }

        function returnToTitle() {
            stopTimer();
            switchView('start-screen');
        }

        // --- Timer Functions ---
        function startTimer() {
            startTime = Date.now();
            timerDisplay.textContent = "00:00.00";
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 10);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const now = Date.now();
            const elapsed = now - startTime;
            timerDisplay.textContent = formatTime(elapsed);
        }

        function formatTime(totalMilliseconds) {
            const minutes = Math.floor(totalMilliseconds / 60000);
            const seconds = Math.floor((totalMilliseconds % 60000) / 1000);
            const centiseconds = Math.floor((totalMilliseconds % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- Distractor Logic ---
        function generateDistractor(correctWord) {
            // Logic:
            // 1. Must start with same letter (index 0).
            // 2. Must share EITHER index 1 OR index 2.
            // 3. The changed letter is random.
            // 4. Result must NOT be in validWords.
            
            const firstLetter = correctWord[0];
            const secondLetter = correctWord[1];
            const thirdLetter = correctWord[2];
            
            let distractor = "";
            let safetyCounter = 0;

            while (true) {
                safetyCounter++;
                if (safetyCounter > 200) {
                    // Fallback if strict logic fails (unlikely)
                    return firstLetter + "XX"; 
                }

                // Randomly decide whether to keep 2nd or 3rd letter
                // 0 = keep 2nd (change 3rd), 1 = keep 3rd (change 2nd)
                const mode = Math.random() < 0.5 ? 0 : 1;
                const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];

                if (mode === 0) {
                    // Keep 1st and 2nd, change 3rd
                    distractor = firstLetter + secondLetter + randomChar;
                } else {
                    // Keep 1st and 3rd, change 2nd
                    distractor = firstLetter + randomChar + thirdLetter;
                }

                // Validation
                if (distractor !== correctWord && !validWords.includes(distractor)) {
                    return distractor;
                }
            }
        }

        function loadQuestion() {
            definitionBox.classList.remove('visible');
            nextBtn.style.display = 'none';
            optionsGrid.innerHTML = '';
            attemptMade = false;
            
            progressDisplay.textContent = `${currentQuestionIndex + 1} / ${totalQuestions}`;
            scoreDisplay.textContent = `${score}`;

            // Pick word from pre-shuffled pool
            currentCorrectWord = gamePool[currentQuestionIndex];
            sessionWords.push(currentCorrectWord);

            const options = new Set();
            options.add(currentCorrectWord);
            
            // Generate 3 distractors
            while (options.size < 4) {
                options.add(generateDistractor(currentCorrectWord));
            }

            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = word;
                btn.onclick = () => handleAnswer(btn, word);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(btn, selectedWord) {
            if (nextBtn.style.display === 'block' || nextBtn.style.display === 'flex') return;

            if (selectedWord === currentCorrectWord) {
                btn.classList.add('correct');
                if (!attemptMade) {
                    score++;
                    scoreDisplay.textContent = `${score}`;
                }
                defWord.textContent = currentCorrectWord;
                defText.textContent = wordDatabase[currentCorrectWord];
                definitionBox.classList.add('visible');

                if (currentQuestionIndex === totalQuestions - 1) {
                    nextBtn.textContent = "Finish";
                } else {
                    nextBtn.textContent = "Next Question";
                }
                nextBtn.style.display = 'block';

                const allBtns = optionsGrid.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    if (b !== btn) b.style.opacity = '0.5';
                    b.style.cursor = 'default';
                });

            } else {
                btn.classList.add('wrong');
                attemptMade = true;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            stopTimer();
            const now = Date.now();
            const elapsed = now - startTime;
            
            switchView('result-screen');
            finalScore.textContent = `${score}/${totalQuestions}`;
            finalTimeDisplay.textContent = `Time: ${formatTime(elapsed)}`;
            
            const percentage = (score / totalQuestions) * 100;
            let remark = "";
            let color = "";

            if (percentage === 100) {
                remark = "Perfect! You are a Scrabble Master!";
                color = "var(--success)";
            } else if (percentage >= 80) {
                remark = "Excellent work! Keep it up!";
                color = "var(--primary)";
            } else if (percentage >= 60) {
                remark = "Good job! A little more practice needed.";
                color = "#eab308";
            } else {
                remark = "Keep practicing! You'll get there.";
                color = "var(--error)";
            }

            finalRemark.textContent = remark;
            finalScore.style.background = `linear-gradient(to right, ${color}, var(--accent))`;
            finalScore.style.webkitBackgroundClip = "text";
            finalScore.style.webkitTextFillColor = "transparent";

            renderReviewList();
        }

        function renderReviewList() {
            reviewList.innerHTML = '';
            
            // Update Header with Focused Letter
            const letter = letterSelect.value;
            const displayLetter = letter === 'ALL' ? 'All Letters' : `Letter ${letter}`;
            reviewHeader.textContent = `Words Practised (${displayLetter})`;

            // Deduplicate words for review list
            const uniqueSessionWords = [...new Set(sessionWords)];
            const sortedWords = uniqueSessionWords.sort();

            sortedWords.forEach(word => {
                const item = document.createElement('div');
                item.className = 'review-item';
                
                const wordSpan = document.createElement('div');
                wordSpan.className = 'review-word';
                wordSpan.textContent = word;

                const defSpan = document.createElement('div');
                defSpan.className = 'review-def';
                defSpan.textContent = wordDatabase[word];

                item.appendChild(wordSpan);
                item.appendChild(defSpan);
                reviewList.appendChild(item);
            });
        }

        // Run initialization
        init();

    </script>


</body></html>
