<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Three-Letter Word Challenge | K S Lo Scrabble</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4338ca;
            --accent: #a855f7;
            --background: #f0f4f8;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scroll */
        }

        /* Header */
        header {
            text-align: center;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 800;
        }

        h1 {
            font-size: 1.2rem;
            background: linear-gradient(to right, var(--primary-dark), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin: 0;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            position: relative;
            overflow: hidden; /* Manage scroll internally */
            padding: 1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.7rem;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-top: 1px solid var(--glass-border);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Views */
        .view {
            display: none;
            width: 100%;
            height: 100%; /* Fill main container */
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        #start-screen {
            justify-content: center;
            align-items: center;
            overflow-y: auto; /* Allow scroll on start screen if needed */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            width: 100%;
        }

        .control-group {
            margin-bottom: 1.5rem;
            text-align: center;
            width: 100%;
        }

        .control-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Custom Select */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        select {
            appearance: none;
            background: white;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        .custom-select-wrapper::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--primary);
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Start Screen Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        button {
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-group button {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
            color: white;
            padding: 0.8rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        /* Game Screen Layout - Flexbox Optimized */
        #game-screen {
            justify-content: flex-start;
            align-items: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            min-width: 70px;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-sub);
            font-weight: 700;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-dark);
            font-variant-numeric: tabular-nums;
        }

        /* Compact Quit Button */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-sub);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--text-sub);
            font-weight: 500;
            flex-shrink: 0;
        }

        /* Flexible Grid */
        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%;
            /* Flex magic: grow to fill space, but shrink if needed */
            flex: 1; 
            min-height: 180px; /* Minimum usable height */
            max-height: 45vh; /* Prevent it from being too tall on large screens */
            margin-bottom: 0.5rem;
        }

        .option-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%; /* Fill grid cell */
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Definition Box */
        .definition-box {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            display: none; /* Hidden initially to save space */
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
            flex-shrink: 0; /* Never shrink this when visible */
            margin-bottom: 0.5rem;
            min-height: 70px;
        }

        .definition-box.visible {
            opacity: 1;
            transform: translateY(0);
            display: flex;
        }

        .def-word {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 0.1rem;
        }

        .def-text {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            line-height: 1.3;
        }

        /* Next Button Container */
        .next-btn-container {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin-top: auto; /* Push to bottom if there is extra space */
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            width: 100%;
            padding: 0.8rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            border: none;
        }

        /* Result Screen */
        #result-screen {
            overflow-y: auto;
            align-items: center;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 1.5rem;
            border-radius: 32px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .final-score {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.25rem 0;
            line-height: 1;
        }

        .final-time {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.5);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .remark {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .review-container {
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            text-align: left;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.5);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .review-header {
            padding: 0.75rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.4);
        }

        .review-list {
            overflow-y: auto;
            padding: 0.5rem;
        }

        .review-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.9rem;
        }

        .review-word {
            font-weight: 800;
            color: var(--primary);
            width: 50px;
            flex-shrink: 0;
        }

        @media (max-height: 600px) {
            .grid-options { min-height: 150px; }
            .option-btn { font-size: 1.5rem; }
            .definition-box { min-height: 60px; padding: 0.5rem; }
            .def-word { font-size: 1rem; }
            .def-text { font-size: 0.85rem; }
            .score-board { padding: 5px 10px; }
            header { padding: 0.25rem; }
            h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">K S Lo Scrabble</div>
        <h1>Three-Letter Word Challenge</h1>
        <div class="subtitle">CSW24</div>
    </header>

    <main>
        <!-- Start Screen -->
        <div id="start-screen" class="view active">
            <div class="glass-panel">
                
                <div class="control-group">
                    <label class="control-label">Select Letter to Practice</label>
                    <div class="custom-select-wrapper">
                        <select id="letter-select">
                            <option value="ALL">All Letters</option>
                            <!-- Options A-Z injected by JS -->
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Number of Questions</label>
                    <div class="btn-group">
                        <button onclick="startGame(10)">10</button>
                        <button onclick="startGame(20)">20</button>
                        <button onclick="startGame(30)">30</button>
                        <button onclick="startGame(40)">40</button>
                        <button onclick="startGame(50)">50</button>
                        <button onclick="startGame(100)">100</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="view">
            <div class="score-board">
                <div class="stat-item">
                    <span class="stat-label">Progress</span>
                    <span class="stat-value" id="progress-display">1 / 10</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer-display">00:00.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score-display">0</span>
                </div>
            </div>
            
            <button class="btn-secondary" onclick="returnToTitle()">Quit to Title</button>

            <div class="question-text">Choose the correct 3-letter word.</div>

            <div class="grid-options" id="options-grid">
                <!-- Buttons injected by JS -->
            </div>

            <div class="definition-box" id="definition-box">
                <div class="def-word" id="def-word"></div>
                <div class="def-text" id="def-text"></div>
            </div>

            <div class="next-btn-container">
                <button id="next-btn" class="btn-primary" style="display: none;" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="view">
            <div class="result-card">
                <h2 style="color: var(--primary-dark); font-size: 1.5rem;">Challenge Complete!</h2>
                <div class="final-score" id="final-score">8/10</div>
                <div class="final-time" id="final-time-display">Time: 00:00.00</div>
                <div class="remark" id="final-remark">Excellent work!</div>
                
                <div class="review-container">
                    <div class="review-header" id="review-header">Words Practised</div>
                    <div id="review-list" class="review-list">
                        <!-- Items injected by JS -->
                    </div>
                </div>

                <button class="btn-primary" onclick="returnToTitle()">Play Again</button>
            </div>
        </div>
    </main>

    <footer>
        &copy; <span id="current-year"></span> K S Lo Scrabble Team. All Rights Reserved.
    </footer>

        function formatTime(totalMilliseconds) {
            const minutes = Math.floor(totalMilliseconds / 60000);
            const seconds = Math.floor((totalMilliseconds % 60000) / 1000);
            const centiseconds = Math.floor((totalMilliseconds % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {

                [array[i], array[j]] = [array[j], array[i]];
            }

                const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];

                    distractor = firstLetter + randomChar + thirdLetter;
                }

                if (distractor !== correctWord && !fullCSWList.includes(distractor)) {
                    return distractor;
                }
            }
        }

        function loadQuestion() {
            definitionBox.classList.remove('visible');
            // Hide next button but keep the container to maintain layout structure if needed,
            // though here we just hide the button itself.
            nextBtn.style.display = 'none';
            optionsGrid.innerHTML = '';
            attemptMade = false;
            
            progressDisplay.textContent = `${currentQuestionIndex + 1} / ${totalQuestions}`;
            scoreDisplay.textContent = `${score}`;

            currentCorrectWord = gamePool[currentQuestionIndex];
            sessionWords.push(currentCorrectWord);

            const options = new Set();
            options.add(currentCorrectWord);
            
            while (options.size < 4) {
                options.add(generateDistractor(currentCorrectWord));
            }

            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = word;
                btn.onclick = () => handleAnswer(btn, word);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(btn, selectedWord) {
            if (nextBtn.style.display === 'block' || nextBtn.style.display === 'flex') return;

            if (selectedWord === currentCorrectWord) {
                btn.classList.add('correct');
                if (!attemptMade) {
                    score++;
                    scoreDisplay.textContent = `${score}`;
                }
                defWord.textContent = currentCorrectWord;
                defText.textContent = wordDatabase[currentCorrectWord];
                definitionBox.classList.add('visible');

                if (currentQuestionIndex === totalQuestions - 1) {
                    nextBtn.textContent = "Finish";
                } else {
                    nextBtn.textContent = "Next Question";
                }
                nextBtn.style.display = 'block';

                const allBtns = optionsGrid.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    if (b !== btn) b.style.opacity = '0.5';
                    b.style.cursor = 'default';
                });

            } else {
                btn.classList.add('wrong');
                attemptMade = true;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            stopTimer();
            const now = Date.now();
            const elapsed = now - startTime;
            
            switchView('result-screen');
            finalScore.textContent = `${score}/${totalQuestions}`;
            finalTimeDisplay.textContent = `Time: ${formatTime(elapsed)}`;
            
            const percentage = (score / totalQuestions) * 100;
            let remark = "";
            let color = "";

            if (percentage === 100) {
                remark = "Perfect! You are a Scrabble Master!";
                color = "var(--success)";
            } else if (percentage >= 80) {
                remark = "Excellent work! Keep it up!";
                color = "var(--primary)";
            } else if (percentage >= 60) {
                remark = "Good job! A little more practice needed.";
                color = "#eab308";
            } else {
                remark = "Keep practicing! You'll get there.";
                color = "var(--error)";
            }

            finalRemark.textContent = remark;
            finalScore.style.background = `linear-gradient(to right, ${color}, var(--accent))`;
            finalScore.style.webkitBackgroundClip = "text";
            finalScore.style.webkitTextFillColor = "transparent";

            renderReviewList();
        }

        function renderReviewList() {
            reviewList.innerHTML = '';
            
            const letter = letterSelect.value;
            const displayLetter = letter === 'ALL' ? 'All Letters' : `Letter ${letter}`;
            reviewHeader.textContent = `Words Practised (${displayLetter})`;

            const uniqueSessionWords = [...new Set(sessionWords)];
            const sortedWords = uniqueSessionWords.sort();

            sortedWords.forEach(word => {
                const item = document.createElement('div');
                item.className = 'review-item';
                
                const wordSpan = document.createElement('div');
                wordSpan.className = 'review-word';
                wordSpan.textContent = word;

                const defSpan = document.createElement('div');
                defSpan.className = 'review-def';
                defSpan.textContent = wordDatabase[word];

                item.appendChild(wordSpan);
                item.appendChild(defSpan);
                reviewList.appendChild(item);
            });
        }

        init();

    </script>
</body>
</html>
